[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fincli"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "requests",
    "urllib3<2",  # cfscrape requires urllib3 1.x API
    "pandas",
    "cfscrape",
    "click",
    "pydantic",
    "pydantic-settings",
    "colorama",
    "beautifulsoup4",
    "platformdirs",
    "fastapi",
    "uvicorn[standard]",
    "prometheus-client>=0.20",  # observability: /metrics exposition
]

[project.optional-dependencies]
dev = [
    # Pinned to one minor so `ruff format --check` output is stable across
    # venv rebuilds: 0.16 began formatting Markdown code fences, and unpinned
    # worktree venvs resolving different ruff minors made the same tree pass
    # one gate run and fail the next (2026-08-12 burndown session).
    "ruff>=0.16.2,<0.17",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "types-beautifulsoup4",
    "pandas-stubs",
    "types-colorama",
    # Newer releases require urllib3>=2, incompatible with cfscrape.
    "types-requests==2.31.0.6",
    "pip-audit",
    # FastAPI TestClient transport (httpx>=0.23 required by starlette TestClient).
    "httpx",
    # YAML emission for scripts/dump_openapi.py (dev-only tooling; not used at
    # API runtime, which serves JSON via FastAPI's built-in /openapi.json).
    "pyyaml",
]

[project.scripts]
fincli = "fincli.app.cli:run_main"
fincli-api = "fincli_api.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "workspace_output",
    "workspace_materials",
    "dist",
    "htmlcov",
    "__pycache__",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Finviz filter inventory: `Fundamental_Params`, `Descriptive_Params`, and
# `Technical_Params` are public-API class names referenced by validators,
# query builders, tests, and the CONTRACTS §2.1 documentation. The mixed
# PascalCase + underscore style mirrors the Finviz vocabulary they wrap
# (`fa_pe`, `sec`, `ta_rsi14`) and is documented in CONTRACTS §2. Renaming
# would be a breaking change per CONTRACTS §7.
"fincli/resource/params/fundamental_params.py" = ["N801"]
"fincli/resource/params/descriptive_params.py" = ["N801"]
"fincli/resource/params/technical_params.py" = ["N801"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# The COMPLETE shipped surface must stay listed here — it is the scope for the
# blocking strict-mypy Stop gate (harness-quality-gates-burndown spec). The
# 2026-08-11 audit found `fincli_api` silently dropped by the feat/observability
# merge resolution (the branch pre-dated the burndown merge); restored below.
files = ["fincli", "fincli_api", "core", "config", "logger", "observability", "singleton.py"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
# cfscrape publishes no inline types or maintained stub package.
module = ["cfscrape"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["fincli", "fincli_api", "core", "config", "logger", "singleton"]

[tool.coverage.report]
fail_under = 90
show_missing = true

# Pytest configuration lives in `pytest.ini` at repo root, NOT here. Pytest
# precedence picks up pytest.ini first when both files exist, which silently
# made any `[tool.pytest.ini_options]` settings inert. T5c surfaced this; the
# fix consolidates pytest config in pytest.ini as the single source of truth.

[tool.setuptools]
py-modules = ["singleton"]

[tool.setuptools.packages.find]
include = ["fincli*", "core*", "config*", "logger*", "fincli_api*", "observability*"]
